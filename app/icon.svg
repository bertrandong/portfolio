<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Dark background -->
  <rect width="32" height="32" fill="#0d1117" rx="3"/>

  <!-- Monitor body -->
  <rect x="2" y="2" width="28" height="20" fill="#2563eb" rx="1"/>
  <!-- Monitor bezel -->
  <rect x="3" y="3" width="26" height="18" fill="#1e3a5f"/>
  <!-- Screen -->
  <rect x="5" y="5" width="22" height="14" fill="#070d1a"/>

  <!-- Pixel art < symbol -->
  <rect x="7"  y="9"  width="2" height="2" fill="#4fc3f7"/>
  <rect x="7"  y="11" width="2" height="2" fill="#4fc3f7"/>
  <rect x="7"  y="13" width="2" height="2" fill="#4fc3f7"/>
  <rect x="9"  y="8"  width="2" height="2" fill="#4fc3f7"/>
  <rect x="9"  y="14" width="2" height="2" fill="#4fc3f7"/>

  <!-- Pixel art / symbol -->
  <rect x="14" y="14" width="2" height="2" fill="#7dd3fc"/>
  <rect x="15" y="12" width="2" height="2" fill="#7dd3fc"/>
  <rect x="16" y="10" width="2" height="2" fill="#7dd3fc"/>
  <rect x="17" y="8"  width="2" height="2" fill="#7dd3fc"/>

  <!-- Pixel art > symbol -->
  <rect x="21" y="9"  width="2" height="2" fill="#4fc3f7"/>
  <rect x="21" y="11" width="2" height="2" fill="#4fc3f7"/>
  <rect x="21" y="13" width="2" height="2" fill="#4fc3f7"/>
  <rect x="19" y="8"  width="2" height="2" fill="#4fc3f7"/>
  <rect x="19" y="14" width="2" height="2" fill="#4fc3f7"/>

  <!-- Monitor stand -->
  <rect x="13" y="22" width="6" height="3" fill="#2563eb"/>
  <!-- Monitor base -->
  <rect x="9"  y="25" width="14" height="3" fill="#2563eb" rx="1"/>
</svg>
